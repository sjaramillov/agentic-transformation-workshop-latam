name: Local checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-checks:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/render_diagrams.py --check
      - run: python scripts/render_presentation.py --check
      - run: python -m unittest discover -s tests -v
  database-e2e:
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python booking_lab/run.py e2e --output .local/db-e2e.json
        env:
          LAB_EVIDENCE_ENV: GitHub Actions ubuntu-24.04 repetition ${{ matrix.repetition }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: database-e2e-evidence-${{ matrix.repetition }}
          path: .local/db-e2e.json
          # Credentials, private .env files, dumps and raw logs are excluded.
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web_tests/package-lock.json
      - run: python -m unittest discover -s tests -p test_web_engine.py -v
      - run: npm ci --ignore-scripts
        working-directory: web_tests
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web_tests
      - run: npm test
        working-directory: web_tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-e2e-evidence
          path: .local/web-e2e/
  publish-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [public-checks, database-e2e, browser-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .local/site
      - name: Deploy public workshop
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
