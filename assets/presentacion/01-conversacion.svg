<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Escuchar, preguntar, aprender</title><desc id="desc">La pregunta abre una respuesta del cliente. El coach ayuda a interpretarla y el tablero conserva el aprendizaje.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d4d7ca"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#387363"/></marker></defs>
<rect width="1200" height="650" rx="20" fill="#f6f4ed"/><rect width="1200" height="650" rx="20" fill="url(#dots)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="50" y="60" font-size="18" font-weight="750" fill="#387363" text-anchor="start">UNA CONVERSACIÓN QUE DEJA HUELLA</text><rect x="65" y="105" width="290" height="165" rx="12" fill="#fff0bb" stroke="none"/><text x="90" y="160" font-size="34" font-weight="750" fill="#203b33" text-anchor="start">Tú</text><text x="90" y="203" font-size="20" font-weight="500" fill="#203b33" text-anchor="start">Eliges una pregunta</text><rect x="455" y="105" width="290" height="165" rx="12" fill="#e5dcf1" stroke="none"/><text x="480" y="160" font-size="34" font-weight="750" fill="#203b33" text-anchor="start">Cliente</text><text x="480" y="203" font-size="20" font-weight="500" fill="#203b33" text-anchor="start">Cuenta lo que sucede</text><rect x="845" y="105" width="290" height="165" rx="12" fill="#dcebdc" stroke="none"/><text x="870" y="160" font-size="34" font-weight="750" fill="#203b33" text-anchor="start">Coach</text><text x="870" y="203" font-size="20" font-weight="500" fill="#203b33" text-anchor="start">Ayuda a profundizar</text><path d="M370 187H435" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M760 187H825" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="68" y="355" width="290" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="65" y="350" width="290" height="114" rx="3" fill="#fff0bb" stroke="#203b3320"/><path d="M338 350h17v17z" fill="#203b3318"/><text x="80" y="374" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">PREGUNTA</text><text x="80" y="406" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">¿Qué ocurrió la</text><text x="80" y="432" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">última vez?</text><rect x="458" y="355" width="290" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="455" y="350" width="290" height="114" rx="3" fill="#f9d8d0" stroke="#203b3320"/><path d="M728 350h17v17z" fill="#203b3318"/><text x="470" y="374" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">DOLOR</text><text x="470" y="406" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">No sabemos si se</text><text x="470" y="432" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">cobró</text><rect x="848" y="355" width="290" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="845" y="350" width="290" height="114" rx="3" fill="#dcebdc" stroke="#203b3320"/><path d="M1118 350h17v17z" fill="#203b3318"/><text x="860" y="374" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">APRENDIZAJE</text><text x="860" y="406" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Ubicar la excepción</text><path d="M600 282V333" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="560" font-size="26" font-weight="650" fill="#203b33" text-anchor="middle">Cada respuesta añade una pieza al tablero.</text></g></svg>
