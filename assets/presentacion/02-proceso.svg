<rect width="1200" height="650" rx="20" fill="#f6f4ed"/><rect width="1200" height="650" rx="20" fill="url(#dots)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="55" font-size="18" font-weight="750" fill="#387363" text-anchor="start">A · PRIMERO ENTENDER EL PROCESO</text><text x="250" y="105" font-size="20" font-weight="700" fill="#203b33" text-anchor="middle">Inicio</text><rect x="163" y="137" width="184" height="135" rx="3" fill="#203b3312" stroke="none"/><rect x="160" y="132" width="184" height="135" rx="3" fill="#ffe1bc" stroke="#203b3320"/><path d="M327 132h17v17z" fill="#203b3318"/><text x="175" y="156" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">EVENTO</text><text x="175" y="188" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Solicitud</text><text x="175" y="214" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">recibida</text><path d="M346 198h16" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="454" y="105" font-size="20" font-weight="700" fill="#203b33" text-anchor="middle">Decisión</text><rect x="367" y="137" width="184" height="135" rx="3" fill="#203b3312" stroke="none"/><rect x="364" y="132" width="184" height="135" rx="3" fill="#ffe1bc" stroke="#203b3320"/><path d="M531 132h17v17z" fill="#203b3318"/><text x="379" y="156" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">EVENTO</text><text x="379" y="188" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Propuesta</text><text x="379" y="214" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">aprobada</text><path d="M550 198h16" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="658" y="105" font-size="20" font-weight="700" fill="#203b33" text-anchor="middle">Efecto</text><rect x="571" y="137" width="184" height="135" rx="3" fill="#203b3312" stroke="none"/><rect x="568" y="132" width="184" height="135" rx="3" fill="#ffe1bc" stroke="#203b3320"/><path d="M735 132h17v17z" fill="#203b3318"/><text x="583" y="156" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">EVENTO</text><text x="583" y="188" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Pago</text><text x="583" y="214" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">capturado</text><path d="M754 198h16" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="862" y="105" font-size="20" font-weight="700" fill="#203b33" text-anchor="middle">Resultado</text><rect x="775" y="137" width="184" height="135" rx="3" fill="#203b3312" stroke="none"/><rect x="772" y="132" width="184" height="135" rx="3" fill="#ffe1bc" stroke="#203b3320"/><path d="M939 132h17v17z" fill="#203b3318"/><text x="787" y="156" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">EVENTO</text><text x="787" y="188" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Reserva</text><text x="787" y="214" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">confirmada</text><text x="1066" y="105" font-size="20" font-weight="700" fill="#203b33" text-anchor="middle">Excepción</text><rect x="979" y="137" width="184" height="135" rx="3" fill="#203b3312" stroke="none"/><rect x="976" y="132" width="184" height="135" rx="3" fill="#ffe1bc" stroke="#203b3320"/><path d="M1143 132h17v17z" fill="#203b3318"/><text x="991" y="156" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">EVENTO</text><text x="991" y="188" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Caso</text><text x="991" y="214" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">reconciliado</text><text x="28" y="208" font-size="18" font-weight="700" fill="#203b33" text-anchor="start">Sucede</text><text x="28" y="341" font-size="18" font-weight="700" fill="#203b33" text-anchor="start">Actúa</text><text x="28" y="474" font-size="18" font-weight="700" fill="#203b33" text-anchor="start">Duele</text><rect x="163" y="297" width="184" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="160" y="292" width="184" height="114" rx="3" fill="#e5dcf1" stroke="#203b3320"/><path d="M327 292h17v17z" fill="#203b3318"/><text x="175" y="316" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">PERSONA</text><text x="175" y="348" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Viajero</text><rect x="367" y="297" width="184" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="364" y="292" width="184" height="114" rx="3" fill="#e5dcf1" stroke="#203b3320"/><path d="M531 292h17v17z" fill="#203b3318"/><text x="379" y="316" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">PERSONA</text><text x="379" y="348" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Persona que</text><text x="379" y="374" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">aprueba</text><rect x="979" y="297" width="184" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="976" y="292" width="184" height="114" rx="3" fill="#e5dcf1" stroke="#203b3320"/><path d="M1143 292h17v17z" fill="#203b3318"/><text x="991" y="316" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">PERSONA</text><text x="991" y="348" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Operaciones</text><rect x="979" y="440" width="184" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="976" y="435" width="184" height="114" rx="3" fill="#f9d8d0" stroke="#203b3320"/><path d="M1143 435h17v17z" fill="#203b3318"/><text x="991" y="459" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">DOLOR</text><text x="991" y="491" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Resultado</text><text x="991" y="517" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">incierto</text><text x="175" y="500" font-size="25" font-weight="650" fill="#203b33" text-anchor="start">«Se perdió la respuesta. ¿Se reservó y se cobró?»</text><text x="40" y="610" font-size="21" font-weight="650" fill="#387363" text-anchor="start">A1 dolor → A2 límites → A3 eventos → A4 excepción → A5–A9 contexto</text></g></svg>
