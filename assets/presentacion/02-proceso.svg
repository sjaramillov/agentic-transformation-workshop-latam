<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Del proceso a su dolor</title><desc id="desc">Los eventos se ordenan; personas, datos y dolores se ubican bajo el paso al que pertenecen. El dolor del caso está en la recuperación.</desc>
