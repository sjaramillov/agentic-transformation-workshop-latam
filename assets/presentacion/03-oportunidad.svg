y="201" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Explicar el</text><text x="695" y="227" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">estado</text><rect x="898" y="150" width="200" height="139" rx="3" fill="#203b3312" stroke="none"/><rect x="895" y="145" width="200" height="139" rx="3" fill="#fff0bb" stroke="#387363"/><path d="M1078 145h17v17z" fill="#203b3318"/><text x="910" y="169" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">P + H · ELEGIDA</text><text x="910" y="201" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Preparar una</text><text x="910" y="227" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">reserva</text><text x="682" y="325" font-size="21" font-weight="650" fill="#203b33" text-anchor="start">La persona decide; el agente prepara.</text><text x="206" y="477" font-size="22" font-weight="500" fill="#203b33" text-anchor="start">Primero integrar los datos.</text><rect x="683" y="416" width="330" height="135" rx="3" fill="#203b3312" stroke="none"/><rect x="680" y="411" width="330" height="135" rx="3" fill="#f9d8d0" stroke="#203b3320"/><path d="M993 411h17v17z" fill="#203b3318"/><text x="695" y="435" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">DATOS POR HABILITAR</text><text x="695" y="467" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Excepciones comerciales</text></g></svg>
