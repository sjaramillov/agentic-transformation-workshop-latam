<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Elegir la oportunidad</title><desc id="desc">Cuadrantes de reglas o criterio y disponibilidad de datos. Preparar una reserva se elige con decisión humana: P y H.</desc>
