<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Un flujo con una decisión humana</title><desc id="desc">La persona solicita. El agente consulta y propone. La persona aprueba. La API valida y ejecuta. La respuesta incierta se recupera sin duplicar.</desc>
