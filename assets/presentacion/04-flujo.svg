<rect width="1200" height="650" rx="20" fill="#f6f4ed"/><rect width="1200" height="650" rx="20" fill="url(#dots)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="55" font-size="18" font-weight="750" fill="#387363" text-anchor="start">C · CADA ACCIÓN EN SU CARRIL</text><rect x="20" y="100" width="1160" height="148" rx="12" fill="#fffdf7" stroke="#d4d7ca"/><text x="40" y="145" font-size="21" font-weight="750" fill="#203b33" text-anchor="start">Persona</text><rect x="20" y="265" width="1160" height="148" rx="12" fill="#fffdf7" stroke="#d4d7ca"/><text x="40" y="310" font-size="21" font-weight="750" fill="#203b33" text-anchor="start">Agente</text><rect x="20" y="430" width="1160" height="148" rx="12" fill="#fffdf7" stroke="#d4d7ca"/><text x="40" y="475" font-size="21" font-weight="750" fill="#203b33" text-anchor="start">API / datos</text><path d="M355 191V245H435V290" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M575 330H620V198H660" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M805 207V493H865" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="213" y="120" width="180" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="210" y="115" width="180" height="114" rx="3" fill="#ffe1bc" stroke="#203b3320"/><path d="M373 115h17v17z" fill="#203b3318"/><text x="225" y="139" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">INTENCIÓN</text><text x="225" y="171" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Solicitar</text><text x="225" y="197" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">reserva</text><rect x="328" y="285" width="260" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="325" y="280" width="260" height="114" rx="3" fill="#d7eaf2" stroke="#203b3320"/><path d="M568 280h17v17z" fill="#203b3318"/><text x="340" y="304" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">CONSULTA Y PROPUESTA</text><text x="340" y="336" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Preparar la</text><text x="340" y="362" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">decisión</text><rect x="663" y="120" width="220" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="660" y="115" width="220" height="114" rx="3" fill="#fff0bb" stroke="#203b3320"/><path d="M863 115h17v17z" fill="#203b3318"/><text x="675" y="139" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">P + H</text><text x="675" y="171" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Aprobar o</text><text x="675" y="197" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">rechazar</text><rect x="868" y="450" width="280" height="114" rx="3" fill="#203b3312" stroke="none"/><rect x="865" y="445" width="280" height="114" rx="3" fill="#dcebdc" stroke="#203b3320"/><path d="M1128 445h17v17z" fill="#203b3318"/><text x="880" y="469" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">ACCIÓN AUTORIZADA</text><text x="880" y="501" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Validar y ejecutar</text><text x="210" y="494" font-size="23" font-weight="700" fill="#203b33" text-anchor="start">¿Respuesta incierta?</text><text x="210" y="532" font-size="22" font-weight="500" fill="#203b33" text-anchor="start">Consultar el estado y recuperar.</text><path d="M850 520H630" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="620" font-size="21" font-weight="650" fill="#387363" text-anchor="start">Rechazar termina sin escritura. Cancelar requiere una aprobación nueva.</text></g></svg>
