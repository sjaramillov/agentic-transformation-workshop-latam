<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Dos evaluaciones, una mejora concreta</title><desc id="desc">ARA revisa la interacción con agentes; MODA la madurez de la aplicación. Los hallazgos se conectan con el dolor, una mejora y su comprobación.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d4d7ca"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#387363"/></marker></defs>
<rect width="1200" height="650" rx="20" fill="#f6f4ed"/><rect width="1200" height="650" rx="20" fill="url(#dots)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="55" font-size="18" font-weight="750" fill="#387363" text-anchor="start">D–I · EVALUAR PARA DECIDIR QUÉ CAMBIAR</text><rect x="73" y="115" width="470" height="165" rx="3" fill="#203b3312" stroke="none"/><rect x="70" y="110" width="470" height="165" rx="3" fill="#d7eaf2" stroke="#203b3320"/><path d="M523 110h17v17z" fill="#203b3318"/><text x="85" y="134" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">ARA · INTERACCIÓN CON AGENTES</text><text x="85" y="166" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">¿La aplicación permite actuar con</text><text x="85" y="192" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">controles claros?</text><rect x="663" y="115" width="470" height="165" rx="3" fill="#203b3312" stroke="none"/><rect x="660" y="110" width="470" height="165" rx="3" fill="#e5dcf1" stroke="#203b3320"/><path d="M1113 110h17v17z" fill="#203b3318"/><text x="675" y="134" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">MODA · MODERNIZACIÓN</text><text x="675" y="166" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">¿Qué capacidades de la aplicación</text><text x="675" y="192" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">conviene mejorar?</text><path d="M305 290V333H150V375" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M895 290V333H325" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="53" y="395" width="200" height="160" rx="3" fill="#203b3312" stroke="none"/><rect x="50" y="390" width="200" height="160" rx="3" fill="#f9d8d0" stroke="#203b3320"/><path d="M233 390h17v17z" fill="#203b3318"/><text x="65" y="414" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">PRIORIZAR</text><text x="65" y="446" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Vincular el</text><text x="65" y="472" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">hallazgo al</text><text x="65" y="498" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">dolor</text><path d="M260 470h75" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="353" y="395" width="200" height="160" rx="3" fill="#203b3312" stroke="none"/><rect x="350" y="390" width="200" height="160" rx="3" fill="#fff0bb" stroke="#203b3320"/><path d="M533 390h17v17z" fill="#203b3318"/><text x="365" y="414" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">CAMBIAR</text><text x="365" y="446" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Implementar</text><text x="365" y="472" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">una mejora</text><path d="M560 470h75" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="653" y="395" width="200" height="160" rx="3" fill="#203b3312" stroke="none"/><rect x="650" y="390" width="200" height="160" rx="3" fill="#dcebdc" stroke="#203b3320"/><path d="M833 390h17v17z" fill="#203b3318"/><text x="665" y="414" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">COMPROBAR</text><text x="665" y="446" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Probar el</text><text x="665" y="472" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">flujo completo</text><path d="M860 470h75" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="953" y="395" width="200" height="160" rx="3" fill="#203b3312" stroke="none"/><rect x="950" y="390" width="200" height="160" rx="3" fill="#d7eaf2" stroke="#203b3320"/><path d="M1133 390h17v17z" fill="#203b3318"/><text x="965" y="414" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">COMPARAR</text><text x="965" y="446" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Reevaluar el</text><text x="965" y="472" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">mismo alcance</text><text x="600" y="610" font-size="22" font-weight="650" fill="#203b33" text-anchor="middle">La evaluación técnica orienta cambios; el impacto se mide en el proceso.</text></g></svg>
