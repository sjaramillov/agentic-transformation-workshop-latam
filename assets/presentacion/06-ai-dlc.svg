<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="55" font-size="18" font-weight="750" fill="#387363" text-anchor="start">J · DEL DESCUBRIMIENTO A UNA MEJORA QUE SE MIDE</text><rect x="58" y="140" width="310" height="150" rx="3" fill="#203b3312" stroke="none"/><rect x="55" y="135" width="310" height="150" rx="3" fill="#fff0bb" stroke="#203b3320"/><path d="M348 135h17v17z" fill="#203b3318"/><text x="70" y="159" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">INCEPTION</text><text x="70" y="191" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Entender y acordar</text><rect x="448" y="140" width="310" height="150" rx="3" fill="#203b3312" stroke="none"/><rect x="445" y="135" width="310" height="150" rx="3" fill="#d7eaf2" stroke="#203b3320"/><path d="M738 135h17v17z" fill="#203b3318"/><text x="460" y="159" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">CONSTRUCTION</text><text x="460" y="191" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Construir y comprobar</text><rect x="838" y="140" width="310" height="150" rx="3" fill="#203b3312" stroke="none"/><rect x="835" y="135" width="310" height="150" rx="3" fill="#dcebdc" stroke="#203b3320"/><path d="M1128 135h17v17z" fill="#203b3318"/><text x="850" y="159" font-size="13" font-weight="750" fill="#203b33" text-anchor="start">OPERATIONS</text><text x="850" y="191" font-size="22" font-weight="650" fill="#203b33" text-anchor="start">Medir y aprender</text><path d="M380 210h45" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M770 210h45" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="75" y="350" font-size="21" font-weight="550" fill="#203b33" text-anchor="start">Dolor y línea base</text><text x="75" y="395" font-size="21" font-weight="550" fill="#203b33" text-anchor="start">Oportunidad y autonomía</text><text x="75" y="440" font-size="21" font-weight="550" fill="#203b33" text-anchor="start">ARA/MODA y unidad</text><text x="465" y="350" font-size="21" font-weight="550" fill="#203b33" text-anchor="start">Código y controles</text><text x="465" y="395" font-size="21" font-weight="550" fill="#203b33" text-anchor="start">Pruebas del flujo</text><text x="465" y="440" font-size="21" font-weight="550" fill="#203b33" text-anchor="start">Revisión con el equipo</text><text x="855" y="350" font-size="21" font-weight="550" fill="#203b33" text-anchor="start">Tiempo de conciliación</text><text x="855" y="395" font-size="21" font-weight="550" fill="#203b33" text-anchor="start">Casos sin duplicados</text><text x="855" y="440" font-size="21" font-weight="550" fill="#203b33" text-anchor="start">Responsable y seguimiento</text><path d="M990 475V545H210V480" fill="none" stroke="#387363" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="600" font-size="24" font-weight="650" fill="#203b33" text-anchor="middle">Ficha de valor: problema + indicador + meta + responsable.</text></g></svg>
