<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Llevar el aprendizaje a AI-DLC</title><desc id="desc">Inception acuerda problema, valor y alcance. Construction implementa y prueba una unidad. Operations mide el resultado y alimenta el siguiente ciclo.</desc>
