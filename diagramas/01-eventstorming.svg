    <g><rect x="278" y="564" width="186" height="82" rx="8" fill="#d7edd9" /><path d="M438 564H464V590Z" fill="#b8dbbb" /><text x="294" y="587" class="tag">LECTURA</text><text x="294" y="615" class="note">Escenario público</text></g>
    <g><rect x="489" y="564" width="186" height="82" rx="8" fill="#d7edd9" /><path d="M649 564H675V590Z" fill="#b8dbbb" /><text x="505" y="587" class="tag">SISTEMA</text><text x="505" y="615" class="note">Token + scopes</text></g>
    <g><rect x="700" y="564" width="186" height="82" rx="8" fill="#d7edd9" /><path d="M860 564H886V590Z" fill="#b8dbbb" /><text x="716" y="587" class="tag">EXTERNO</text><text x="716" y="615" class="note">Pagos sintéticos</text></g>
    <g><rect x="911" y="564" width="186" height="82" rx="8" fill="#d7edd9" /><path d="M1071 564H1097V590Z" fill="#b8dbbb" /><text x="927" y="587" class="tag">DATOS</text><text x="927" y="615" class="note">PostgreSQL</text></g>
    <g><rect x="1122" y="564" width="186" height="82" rx="8" fill="#d7edd9" /><path d="M1282 564H1308V590Z" fill="#b8dbbb" /><text x="1138" y="587" class="tag">ORQUESTACIÓN</text><text x="1138" y="615" class="note">Saga + worker</text></g>
