    <g><rect x="700" y="231" width="186" height="82" rx="8" fill="#e2d7f5" /><path d="M860 231H886V257Z" fill="#c8b5e9" /><text x="716" y="254" class="tag">PROVEEDOR</text><text x="716" y="282" class="note">Recibe el cobro</text></g>
    <g><rect x="911" y="231" width="186" height="82" rx="8" fill="#e2d7f5" /><path d="M1071 231H1097V257Z" fill="#c8b5e9" /><text x="927" y="254" class="tag">API / DB</text><text x="927" y="282" class="note">Valida persistencia</text></g>
    <g><rect x="1122" y="231" width="186" height="82" rx="8" fill="#e2d7f5" /><path d="M1282 231H1308V257Z" fill="#c8b5e9" /><text x="1138" y="254" class="tag">WORKER</text><text x="1138" y="282" class="note">Retoma operación</text></g>
    <g><rect x="1333" y="231" width="220" height="82" rx="8" fill="#e2d7f5" /><path d="M1527 231H1553V257Z" fill="#c8b5e9" /><text x="1349" y="254" class="tag">OPERADOR</text><text x="1349" y="282" class="note">Revisa resultado</text></g>
  </g>


