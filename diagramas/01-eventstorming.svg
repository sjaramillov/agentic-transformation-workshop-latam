    <g><rect x="278" y="453" width="186" height="82" rx="8" fill="#ffe0c4" /><path d="M438 453H464V479Z" fill="#f7c69b" /><text x="294" y="476" class="tag">EVENTO</text><text x="294" y="504" class="note">Intención preparada</text></g>
