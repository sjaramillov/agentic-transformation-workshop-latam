    <g><rect x="489" y="675" width="186" height="82" rx="8" fill="#ffd9d3" /><path d="M649 675H675V701Z" fill="#f6bdb5" /><text x="505" y="698" class="tag">CONTROL</text><text x="505" y="726" class="note">Aislar por sujeto</text></g>
    <g><rect x="700" y="675" width="186" height="82" rx="8" fill="#ffd9d3" /><path d="M860 675H886V701Z" fill="#f6bdb5" /><text x="716" y="698" class="tag">EXCEPCIÓN</text><text x="716" y="726" class="note">Respuesta ambigua</text></g>
