  <path d="M27 795H1573" stroke="#c6c1b6" stroke-width="1.5" />
  <text x="40" y="838" class="tiny muted">LECTURA DEL TABLERO</text>
  <text x="40" y="870" class="subtitle">La intención y los eventos persisten antes de avanzar. Si falla la reserva, el worker reintenta el reembolso con la misma clave.</text>
  <text x="40" y="932" class="tiny muted">Código y escenario originales MIT: booking_lab/ y workshop/scenario.json. Recuperación y auditoría verificadas con PostgreSQL.</text>
