    <g><rect x="700" y="453" width="186" height="82" rx="8" fill="#ffe0c4" /><path d="M860 453H886V479Z" fill="#f7c69b" /><text x="716" y="476" class="tag">EVENTO</text><text x="716" y="504" class="note">Pago capturado</text></g>
    <g><rect x="911" y="453" width="186" height="82" rx="8" fill="#ffe0c4" /><path d="M1071 453H1097V479Z" fill="#f7c69b" /><text x="927" y="476" class="tag">EVENTO</text><text x="927" y="504" class="note">Reserva confirmada</text></g>
