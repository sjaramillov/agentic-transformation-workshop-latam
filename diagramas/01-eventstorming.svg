<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 970" role="img" aria-labelledby="title desc">
  <title id="title">EventStorming: reserva y recuperación</title>
  <desc id="desc">Tablero de seis momentos con actores, comandos, eventos del dominio, sistemas y fricciones, desde preparar una reserva hasta recuperar y auditar su ejecución.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d8d3c8" /></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#344354" flood-opacity=".16" /></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d7882" /></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17283b}
      .white{fill:#fffdfa!important}.muted{fill:#536575}.kicker{font-size:14px;font-weight:800;letter-spacing:2px}.title{font-size:34px;font-weight:800;letter-spacing:-.7px}.subtitle{font-size:17px}.step{font-size:15px;font-weight:800}.lane{font-size:17px;font-weight:800}.lanehint{font-size:12px;font-weight:700;letter-spacing:1px}.tag{font-size:11px;font-weight:900;letter-spacing:1px}.note{font-size:17px;font-weight:700}.tiny{font-size:13px}
    </style>
  </defs>
  <rect width="1600" height="970" fill="#f4f1e9" /><rect width="1600" height="970" fill="url(#grid)" opacity=".6" />
  <path d="M0 0H1600V142H0Z" fill="#17283b" />
  <text x="42" y="38" class="kicker" style="fill:#a8d9e6">BOOKING MIT · EVENTSTORMING · A</text>
  <text x="42" y="83" class="title white" style="fill:#fffdfa">Una reserva necesita recuperarse</text>
  <text x="42" y="116" class="subtitle" style="fill:#d8e3eb">Cada columna es un momento; cada carril muestra quién actúa, qué cambia y dónde aparece fricción.</text>
  <text x="1538" y="48" text-anchor="end" class="tiny" style="fill:#c6d5df">ESQUEMA CUALITATIVO · NO ES UNA CAPTURA DEL TALLER</text>

  <g class="step" text-anchor="middle">
    <rect x="278" y="165" width="186" height="48" rx="12" fill="#fffdfa" stroke="#d8d4ca" /><text x="371" y="195">01 · PROPONER</text>
    <rect x="489" y="165" width="186" height="48" rx="12" fill="#fffdfa" stroke="#d8d4ca" /><text x="582" y="195">02 · AUTORIZAR</text>
    <rect x="700" y="165" width="186" height="48" rx="12" fill="#fffdfa" stroke="#d8d4ca" /><text x="793" y="195">03 · COBRAR</text>
    <rect x="911" y="165" width="186" height="48" rx="12" fill="#fffdfa" stroke="#d8d4ca" /><text x="1004" y="195">04 · PERSISTIR</text>
    <rect x="1122" y="165" width="186" height="48" rx="12" fill="#fffdfa" stroke="#d8d4ca" /><text x="1215" y="195">05 · RECUPERAR</text>
    <rect x="1333" y="165" width="220" height="48" rx="12" fill="#fffdfa" stroke="#d8d4ca" /><text x="1443" y="195">06 · AUDITAR</text>
  </g>
  <g stroke="#7b858d" stroke-width="2">
    <path d="M465 189H483" /><path d="M676 189H694" /><path d="M887 189H905" /><path d="M1098 189H1116" /><path d="M1309 189H1327" />
  </g>

  <g>
    <rect x="27" y="231" width="228" height="82" rx="12" fill="#e2d7f5" /><text x="46" y="263" class="lane">ACTORES</text><text x="46" y="289" class="lanehint">QUIÉN PARTICIPA</text>
    <rect x="27" y="342" width="228" height="82" rx="12" fill="#ccebf4" /><text x="46" y="374" class="lane">COMANDOS</text><text x="46" y="400" class="lanehint">INTENCIÓN O ACCIÓN</text>
    <rect x="27" y="453" width="228" height="82" rx="12" fill="#ffe0c4" /><text x="46" y="485" class="lane">EVENTOS</text><text x="46" y="511" class="lanehint">ALGO QUE YA PASÓ</text>
    <rect x="27" y="564" width="228" height="82" rx="12" fill="#d7edd9" /><text x="46" y="596" class="lane">SISTEMAS / DATOS</text><text x="46" y="622" class="lanehint">DÓNDE SE APOYA EL FLUJO</text>
    <rect x="27" y="675" width="228" height="82" rx="12" fill="#ffd9d3" /><text x="46" y="707" class="lane">FRICCIONES</text><text x="46" y="733" class="lanehint">RIESGO / PENDIENTE</text>
  </g>


