<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Oportunidad para un agente: juicio y datos</title>
  <desc id="desc">Matriz cualitativa de intensidad de juicio y disponibilidad de datos. Las excepciones de socios necesitan integrar datos; rebooking y elegibilidad de reembolso son oportunidades con autonomía P y revisión humana.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d8d3c8" /></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#344354" flood-opacity=".16" /></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536575" /></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17283b}.white{fill:#fffdfa!important}.muted{fill:#536575}.kicker{font-size:14px;font-weight:800;letter-spacing:2px}.title{font-size:34px;font-weight:800}.subtitle{font-size:17px}.axis{font-size:15px;font-weight:800;letter-spacing:1px}.note-title{font-size:18px;font-weight:800}.body{font-size:15px}.tag{font-size:11px;font-weight:900;letter-spacing:1px}.tier{font-size:18px;font-weight:850}.tiny{font-size:13px}
    </style>
  </defs>
  <rect width="1440" height="960" fill="#f4f1e9" /><rect width="1440" height="960" fill="url(#grid)" opacity=".6" />
  <path d="M0 0H1440V140H0Z" fill="#17283b" />
  <text x="42" y="38" class="kicker" style="fill:#a8d9e6">BOOKING MIT · OPORTUNIDAD · B</text>
  <text x="42" y="83" class="title white" style="fill:#fffdfa">¿Dónde ayuda un agente?</text>
  <text x="42" y="115" class="subtitle" style="fill:#d8e3eb">La oportunidad aparece donde hay juicio y los datos necesarios están al alcance.</text>
  <text x="1397" y="48" text-anchor="end" class="tiny" style="fill:#c6d5df">UBICACIONES CUALITATIVAS · SIN PUNTUACIÓN</text>


  <rect x="150" y="205" width="800" height="555" rx="18" fill="#fffdfa" stroke="#d7d2c8" stroke-width="2" />
  <rect x="150" y="205" width="400" height="277" rx="18" fill="#fce9e3" opacity=".7" />
  <rect x="550" y="205" width="400" height="277" rx="18" fill="#e9f2e8" opacity=".72" />
  <rect x="150" y="482" width="400" height="278" fill="#f6eee8" opacity=".68" />
  <rect x="550" y="482" width="400" height="278" rx="18" fill="#edf3f1" opacity=".75" />
  <path d="M550 205V760M150 482H950" stroke="#d0cbc1" stroke-width="2" stroke-dasharray="8 9" />
  <path d="M170 785H918" stroke="#536575" stroke-width="2.5" />
  <path d="M125 740V224" stroke="#536575" stroke-width="2.5" />
  <text x="160" y="815" class="axis">DATOS DIFÍCILES DE ALCANZAR</text>
  <text x="925" y="815" class="axis" text-anchor="end">DATOS DISPONIBLES</text>
  <text x="62" y="400" class="axis" transform="rotate(-90 62 400)">MÁS JUICIO HUMANO</text>
  <text x="62" y="746" class="axis" transform="rotate(-90 62 746)">REGLAS MÁS CLARAS</text>
  <text x="178" y="236" class="tag" style="fill:#9a4e3e">PRIMERO RESOLVER LA BRECHA</text>
  <text x="576" y="236" class="tag" style="fill:#3b6c4b">CANDIDATOS A AGENTE</text>
  <text x="178" y="515" class="tiny muted">Integrar datos antes de delegar la decisión.</text>
  <text x="576" y="515" class="tiny muted">Con reglas claras, evalúa si basta la automatización.</text>


  <g filter="url(#shadow)">
    <g transform="rotate(-1 350 337)">
      <rect x="194" y="270" width="300" height="145" rx="8" fill="#ffd9d3" />
      <path d="M462 270H494V302Z" fill="#f3b9b0" />
      <text x="216" y="301" class="tag">BRECHA DE DATOS</text>
      <text x="216" y="334" class="note-title">Excepción de socio</text>
      <text x="216" y="363" class="body">Alto juicio, pero historial en</text><text x="216" y="384" class="body">correos y documentos. Integrar</text><text x="216" y="405" class="body">la información primero.</text>
    </g>
    <g transform="rotate(.5 735 310)">
      <rect x="582" y="255" width="334" height="100" rx="8" fill="#ffe49b" />
      <path d="M884 255H916V287Z" fill="#f2d36e" />
      <text x="600" y="280" class="tag">POSTURA P · CANDIDATO</text>
      <text x="600" y="307" class="note-title">Crear una reserva</text>
      <text x="600" y="333" class="body">Prepara opciones; una persona aprueba.</text>
    </g>
    <g transform="rotate(-.4 735 416)">
      <rect x="582" y="367" width="334" height="99" rx="8" fill="#fff0b9" />
      <path d="M884 367H916V399Z" fill="#f2d36e" />
      <text x="600" y="392" class="tag">POSTURA P · CON PUERTA</text>
      <text x="600" y="419" class="note-title">Elegibilidad de reembolso</text>
      <text x="600" y="445" class="body">Prepara el caso; revisión antes del pago.</text>
    </g>
  </g>


  <rect x="990" y="205" width="410" height="555" rx="18" fill="#fffdfa" stroke="#d7d2c8" stroke-width="2" />
  <text x="1020" y="245" class="tag" style="fill:#315a77">ESCALERA DE AUTONOMÍA</text>
  <g filter="url(#shadow)">
    <rect x="1020" y="270" width="350" height="92" rx="12" fill="#e5edf3" /><circle cx="1066" cy="316" r="26" fill="#6a879d" /><text x="1066" y="323" text-anchor="middle" class="tier white" style="fill:#fffdfa">A</text><text x="1110" y="306" class="note-title">Assisted</text><text x="1110" y="333" class="body">La persona realiza cada acción.</text>
    <rect x="1020" y="378" width="350" height="104" rx="12" fill="#ffe49b" stroke="#bd8d2f" stroke-width="2" /><circle cx="1066" cy="430" r="26" fill="#b98128" /><text x="1066" y="437" text-anchor="middle" class="tier white" style="fill:#fffdfa">P</text><text x="1110" y="415" class="note-title">Prepares</text><text x="1110" y="442" class="body">El agente propone; la persona</text><text x="1110" y="463" class="body">aprueba antes de ejecutar.</text>
    <rect x="1020" y="498" width="350" height="92" rx="12" fill="#dcefe4" /><circle cx="1066" cy="544" r="26" fill="#548368" /><text x="1066" y="551" text-anchor="middle" class="tier white" style="fill:#fffdfa">E</text><text x="1110" y="534" class="note-title">Executes</text><text x="1110" y="561" class="body">Actúa con límites; revisión después.</text>
    <rect x="1020" y="606" width="350" height="92" rx="12" fill="#e7ddf4" /><circle cx="1066" cy="652" r="26" fill="#78649b" /><text x="1066" y="659" text-anchor="middle" class="tier white" style="fill:#fffdfa">G</text><text x="1110" y="642" class="note-title">Governs</text><text x="1110" y="669" class="body">Ajusta límites bajo políticas.</text>
  </g>
  <text x="1022" y="730" class="tiny muted">A → P → E → G: aumenta la autonomía.</text>

  <rect x="150" y="852" width="1250" height="66" rx="14" fill="#17283b" />
  <text x="178" y="881" class="tag" style="fill:#a8d9e6">REGLA DE LECTURA</text>
  <text x="178" y="904" class="body white" style="fill:#fffdfa">No subas autonomía para tapar una brecha de datos; primero confirma qué información falta y quién debe aprobar la acción.</text>
<polygon points="918.00,785.00 909.00,789.00 909.00,781.00" fill="#536575" stroke="none" aria-hidden="true" /><polygon points="125.00,224.00 129.00,233.00 121.00,233.00" fill="#536575" stroke="none" aria-hidden="true" /></svg>
