<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1286.4999999999998" role="img" aria-labelledby="title desc">
<title id="title">Elegir una oportunidad con criterio</title><desc id="desc">Compara reglas, interpretación y datos disponibles; acuerda autonomía para cada acción.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#c4cbbd"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#276459"/></marker></defs>
<rect width="100%" height="100%" fill="#f6f4ed"/><rect width="100%" height="100%" fill="url(#dots)" opacity=".55"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="40" y="42" font-size="15" font-weight="750" fill="#276459" text-anchor="start">B · OPORTUNIDAD Y AUTONOMÍA</text>
<text x="40" y="94" font-size="38" font-weight="760" fill="#203b33" text-anchor="start">Elegir una oportunidad con criterio</text>
<text x="40" y="129" font-size="19" font-weight="400" fill="#53645b" text-anchor="start">Compara reglas, interpretación y datos disponibles; acuerda autonomía para cada acción.</text>
<path d="M40 155L1440 155" fill="none" stroke="#cbd1c7" stroke-width="2" />
<text x="40" y="190" font-size="15" font-weight="800" fill="#276459" text-anchor="start">CANDIDATAS → DATOS → CUADRANTES → VALOR → H → AUTONOMÍA</text>
<text x="40" y="219" font-size="18" font-weight="400" fill="#203b33" text-anchor="start">B1–B2 reúne notas en la bandeja; B3 las ubica; B4 compara valor; B5 marca intervención humana; B6 elige el alcance.</text>
<text x="190" y="267.3" font-size="21" font-weight="750" fill="#203b33" text-anchor="start">Reglas conocidas</text>
<text x="630" y="267.3" font-size="21" font-weight="750" fill="#203b33" text-anchor="start">Interpretación y criterio</text>
<text x="40" y="340.3" font-size="19" font-weight="750" fill="#203b33" text-anchor="start">Datos</text>
<text x="40" y="365.95" font-size="19" font-weight="750" fill="#203b33" text-anchor="start">disponibles</text>
<rect x="190" y="292.3" width="420" height="408" rx="6" fill="#fffdf5" stroke="#c8d2c4" />
<text x="210" y="319.3" font-size="15" font-weight="750" fill="#53645b" text-anchor="start">Automatización convencional</text>
<rect x="212" y="356.3" width="380" height="132" rx="6" fill="#273f3112" stroke="none" />
<rect x="210" y="352.3" width="380" height="132" rx="4" fill="#fff0bb" stroke="#203b3314" />
<path d="M572 352.3h18v18z" fill="#203b3315"/>
<text x="226" y="377.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">OPORTUNIDAD · B1</text>
<text x="226" y="405.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">Formulario de reserva</text>
<text x="226" y="435.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Captura y validación con reglas.</text>
<text x="226" y="465.25" font-size="14" font-weight="750" fill="#276459" text-anchor="start">Automatización</text>
<rect x="630" y="292.3" width="420" height="408" rx="6" fill="#fffdf5" stroke="#c8d2c4" />
<text x="650" y="319.3" font-size="15" font-weight="750" fill="#53645b" text-anchor="start">Candidata a asistencia con agente</text>
<rect x="652" y="356.3" width="380" height="155" rx="6" fill="#273f3112" stroke="none" />
<rect x="650" y="352.3" width="380" height="155" rx="4" fill="#fff0bb" stroke="#203b3314" />
<path d="M1012 352.3h18v18z" fill="#203b3315"/>
<text x="666" y="377.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">OPORTUNIDAD · B1</text>
<text x="666" y="405.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">Explicar el estado</text>
<text x="666" y="435.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Interpretar una consulta de</text>
<text x="666" y="458.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">reservas propias.</text>
<text x="666" y="488.2" font-size="14" font-weight="750" fill="#276459" text-anchor="start">E · Exploración asistida</text>
<rect x="652" y="526.3" width="380" height="155" rx="6" fill="#273f3112" stroke="none" />
<rect x="650" y="522.3" width="380" height="155" rx="4" fill="#fff0bb" stroke="#276459" stroke-width="3"/>
<path d="M1012 522.3h18v18z" fill="#203b3315"/>
<text x="666" y="547.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">OPORTUNIDAD · B1 · H</text>
<text x="666" y="575.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">Preparar una reserva</text>
<text x="666" y="605.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Comprender intención y proponer una</text>
<text x="666" y="628.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">operación.</text>
<text x="666" y="658.2" font-size="14" font-weight="750" fill="#276459" text-anchor="start">P · Propone y espera aprobación</text>
<text x="40" y="768.3" font-size="19" font-weight="750" fill="#203b33" text-anchor="start">Datos por</text>
<text x="40" y="793.9499999999999" font-size="19" font-weight="750" fill="#203b33" text-anchor="start">habilitar</text>
<rect x="190" y="720.3" width="420" height="238" rx="6" fill="#fffdf5" stroke="#c8d2c4" />
<text x="210" y="747.3" font-size="15" font-weight="750" fill="#53645b" text-anchor="start">Integrar datos y automatizar</text>
<text x="212" y="808.3" font-size="18" font-weight="400" fill="#53645b" text-anchor="start">Sin candidata en este caso.</text>
<rect x="630" y="720.3" width="420" height="238" rx="6" fill="#fffdf5" stroke="#c8d2c4" />
<text x="650" y="747.3" font-size="15" font-weight="750" fill="#53645b" text-anchor="start">Preparar datos antes de pilotar</text>
<rect x="652" y="784.3" width="380" height="155" rx="6" fill="#273f3112" stroke="none" />
<rect x="650" y="780.3" width="380" height="155" rx="4" fill="#fff0bb" stroke="#203b3314" />
<path d="M1012 780.3h18v18z" fill="#203b3315"/>
<text x="666" y="805.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">OPORTUNIDAD · B2</text>
<text x="666" y="833.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">Excepciones comerciales</text>
<text x="666" y="863.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Las fuentes y permisos todavía se</text>
<text x="666" y="886.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">deben definir.</text>
<text x="666" y="916.2" font-size="14" font-weight="750" fill="#276459" text-anchor="start">Pendiente de datos</text>
<text x="1090" y="317.3" font-size="15" font-weight="800" fill="#276459" text-anchor="start">PATRONES DE AUTONOMÍA</text>
<rect x="1092" y="346.3" width="350" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="1090" y="342.3" width="350" height="127" rx="4" fill="#dcebdc" stroke="#203b3314" />
<path d="M1422 342.3h18v18z" fill="#203b3315"/>
<text x="1106" y="367.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">PATRÓN</text>
<text x="1106" y="395.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">A · Autonomía completa</text>
<text x="1106" y="425.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">El agente decide y actúa dentro</text>
<text x="1106" y="448.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">del alcance acordado.</text>
<rect x="1092" y="489.3" width="350" height="150" rx="6" fill="#273f3112" stroke="none" />
<rect x="1090" y="485.3" width="350" height="150" rx="4" fill="#fff0bb" stroke="#203b3314" />
<path d="M1422 485.3h18v18z" fill="#203b3315"/>
<text x="1106" y="510.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">PATRÓN</text>
<text x="1106" y="538.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">P · Decisión preparada</text>
<text x="1106" y="568.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">El agente propone; una persona</text>
<text x="1106" y="591.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">decide. Elegido para crear y</text>
<text x="1106" y="614.2" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">cancelar.</text>
<rect x="1092" y="655.3" width="350" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="1090" y="651.3" width="350" height="127" rx="4" fill="#d7eaf2" stroke="#203b3314" />
<path d="M1422 651.3h18v18z" fill="#203b3315"/>
<text x="1106" y="676.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">PATRÓN</text>
<text x="1106" y="704.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">E · Exploración asistida</text>
<text x="1106" y="734.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">El agente ayuda a comprender y</text>
<text x="1106" y="757.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">explorar información.</text>
<rect x="1092" y="798.3" width="350" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="1090" y="794.3" width="350" height="127" rx="4" fill="#e5dcf1" stroke="#203b3314" />
<path d="M1422 794.3h18v18z" fill="#203b3315"/>
<text x="1106" y="819.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">PATRÓN</text>
<text x="1106" y="847.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">G · Agente como control</text>
<text x="1106" y="877.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Revisa o contrasta acciones</text>
<text x="1106" y="900.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">frente a reglas.</text>
<text x="1090" y="952.3" font-size="18" font-weight="650" fill="#203b33" text-anchor="start">H · Intervención humana</text>
<text x="1090" y="976.5999999999999" font-size="18" font-weight="650" fill="#203b33" text-anchor="start">obligatoria. Los patrones se</text>
<text x="1090" y="1000.8999999999999" font-size="18" font-weight="650" fill="#203b33" text-anchor="start">eligen por acción; no forman una</text>
<text x="1090" y="1025.1999999999998" font-size="18" font-weight="650" fill="#203b33" text-anchor="start">escala.</text>
<rect x="42.0" y="1078.4999999999998" width="691.0" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="40.0" y="1074.4999999999998" width="691.0" height="127" rx="4" fill="#dcebdc" stroke="#203b3314" />
<path d="M713.0 1074.4999999999998h18v18z" fill="#203b3315"/>
<text x="56.0" y="1099.4999999999998" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">VALOR · B4</text>
<text x="56.0" y="1127.4999999999998" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">Qué resultado comparar</text>
<text x="56.0" y="1157.4999999999998" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Supuestos: 200 casos/mes; 8 → 6 min humanos/caso. Incluir revisión,</text>
<text x="56.0" y="1180.4499999999998" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">errores, recuperación y costo.</text>
<rect x="751.0" y="1078.4999999999998" width="691.0" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="749.0" y="1074.4999999999998" width="691.0" height="127" rx="4" fill="#fff0bb" stroke="#203b3314" />
<path d="M1422.0 1074.4999999999998h18v18z" fill="#203b3315"/>
<text x="765.0" y="1099.4999999999998" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">DECISIÓN · B5</text>
<text x="765.0" y="1127.4999999999998" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">H · Intervención humana obligatoria</text>
<text x="765.0" y="1157.4999999999998" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Crear y cancelar requieren aprobaciones independientes, vinculadas a</text>
<text x="765.0" y="1180.4499999999998" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">cada acción.</text>
<path d="M40 1231.4999999999998L1440 1231.4999999999998" fill="none" stroke="#cbd1c7" stroke-width="2" />
<text x="40" y="1261.4999999999998" font-size="14" font-weight="400" fill="#53645b" text-anchor="start">Fuente editable: workshop/discovery.json · Posiciones cualitativas del caso</text>
<text x="1440" y="1261.4999999999998" font-size="13" font-weight="700" fill="#53645b" text-anchor="end">BOOKING MIT · MATERIAL ABIERTO</text></g>
</svg>
