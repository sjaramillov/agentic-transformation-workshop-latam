<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 952.3" role="img" aria-labelledby="title desc">
<title id="title">Del hallazgo a una mejora comprobada</title><desc id="desc">El proceso define qué importa. La evaluación aporta evidencia sobre las aplicaciones.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#c4cbbd"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#276459"/></marker></defs>
<rect width="100%" height="100%" fill="#f6f4ed"/><rect width="100%" height="100%" fill="url(#dots)" opacity=".55"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="40" y="42" font-size="15" font-weight="750" fill="#276459" text-anchor="start">D–I · ARA Y MODA</text>
<text x="40" y="94" font-size="38" font-weight="760" fill="#203b33" text-anchor="start">Del hallazgo a una mejora comprobada</text>
<text x="40" y="129" font-size="19" font-weight="400" fill="#53645b" text-anchor="start">El proceso define qué importa. La evaluación aporta evidencia sobre las aplicaciones.</text>
<path d="M40 155L1440 155" fill="none" stroke="#cbd1c7" stroke-width="2" />
<text x="40" y="190" font-size="15" font-weight="800" fill="#276459" text-anchor="start">ENTRADA: TABLEROS A–C</text>
<text x="40" y="219" font-size="18" font-weight="400" fill="#203b33" text-anchor="start">Dolor, tarea, autonomía, APIs, dependencias, commit y alcance. El mismo contexto acompaña la comparación.</text>
<rect x="42.0" y="271.3" width="691.0" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="40.0" y="267.3" width="691.0" height="127" rx="4" fill="#f9d8d0" stroke="#203b3314" />
<path d="M713.0 267.3h18v18z" fill="#203b3315"/>
<text x="56.0" y="292.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">EVALUACIÓN ARA</text>
<text x="56.0" y="320.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">ARA · Interacción con agentes</text>
<text x="56.0" y="350.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Revisa interfaces, identidad, datos, resiliencia y observabilidad.</text>
<text x="56.0" y="373.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Distingue BLOCKER de RISK-SAFETY; ambos pueden aparecer como High.</text>
<rect x="751.0" y="271.3" width="691.0" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="749.0" y="267.3" width="691.0" height="127" rx="4" fill="#d7eaf2" stroke="#203b3314" />
<path d="M1422.0 267.3h18v18z" fill="#203b3315"/>
<text x="765.0" y="292.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">EVALUACIÓN MODA</text>
<text x="765.0" y="320.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">MODA · Modernización</text>
<text x="765.0" y="350.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Revisa infraestructura, arquitectura, datos, seguridad y operación.</text>
<text x="765.0" y="373.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Comprueba aplicabilidad, puntuaciones y condiciones de cada ruta.</text>
<rect x="42.0" y="460.3" width="336.5" height="173" rx="6" fill="#273f3112" stroke="none" />
<rect x="40.0" y="456.3" width="336.5" height="173" rx="4" fill="#fff0bb" stroke="#203b3314" />
<path d="M358.5 456.3h18v18z" fill="#203b3315"/>
<text x="56.0" y="481.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">PRIORIDAD</text>
<text x="56.0" y="509.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">1 · Priorizar</text>
<text x="56.0" y="539.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Conecta dolor → hallazgo →</text>
<text x="56.0" y="562.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">capacidad que falta. Define</text>
<text x="56.0" y="585.2" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">dueño y criterio de aceptación.</text>
<rect x="396.5" y="460.3" width="336.5" height="173" rx="6" fill="#273f3112" stroke="none" />
<rect x="394.5" y="456.3" width="336.5" height="173" rx="4" fill="#dcebdc" stroke="#203b3314" />
<path d="M713.0 456.3h18v18z" fill="#203b3315"/>
<text x="410.5" y="481.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">CAMBIO</text>
<text x="410.5" y="509.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">2 · Cambiar</text>
<text x="410.5" y="539.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Implementa una unidad acotada.</text>
<text x="410.5" y="562.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Una remediación asistida</text>
<text x="410.5" y="585.2" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">entrega un cambio para revisar.</text>
<rect x="751.0" y="460.3" width="336.5" height="173" rx="6" fill="#273f3112" stroke="none" />
<rect x="749.0" y="456.3" width="336.5" height="173" rx="4" fill="#e5dcf1" stroke="#203b3314" />
<path d="M1067.5 456.3h18v18z" fill="#203b3315"/>
<text x="765.0" y="481.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">PRUEBA Y REVISIÓN</text>
<text x="765.0" y="509.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">3 · Comprobar</text>
<text x="765.0" y="539.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Revisa el diff y prueba la</text>
<text x="765.0" y="562.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">operación, los fallos y la</text>
<text x="765.0" y="585.2" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">recuperación. Integra el cambio</text>
<text x="765.0" y="608.1500000000001" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">aceptado.</text>
<rect x="1105.5" y="460.3" width="336.5" height="173" rx="6" fill="#273f3112" stroke="none" />
<rect x="1103.5" y="456.3" width="336.5" height="173" rx="4" fill="#ffe1bc" stroke="#203b3314" />
<path d="M1422.0 456.3h18v18z" fill="#203b3315"/>
<text x="1119.5" y="481.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">EVALUACIÓN</text>
<text x="1119.5" y="509.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">4 · Reevaluar</text>
<text x="1119.5" y="539.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Evalúa el nuevo commit. Compara</text>
<text x="1119.5" y="562.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">las mismas preguntas y explica</text>
<text x="1119.5" y="585.2" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">cobertura, rúbrica y cambios.</text>
<path d="M1250 651.3L250 651.3" fill="none" stroke="#276459" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="740" y="679.3" font-size="18" font-weight="650" fill="#276459" text-anchor="middle">La comparación vuelve a alimentar las prioridades</text>
<rect x="42.0" y="721.3" width="454.6666666666667" height="150" rx="6" fill="#273f3112" stroke="none" />
<rect x="40.0" y="717.3" width="454.6666666666667" height="150" rx="4" fill="#dcebdc" stroke="#203b3314" />
<path d="M476.6666666666667 717.3h18v18z" fill="#203b3315"/>
<text x="56.0" y="742.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">TRAZABILIDAD</text>
<text x="56.0" y="770.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">Identidad y alcance</text>
<text x="56.0" y="800.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Aplicación + tipo de análisis +</text>
<text x="56.0" y="823.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">question_id. Conserva commits, archivos y</text>
<text x="56.0" y="846.2" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">contextos de cada evaluación.</text>
<rect x="514.6666666666667" y="721.3" width="454.6666666666667" height="150" rx="6" fill="#273f3112" stroke="none" />
<rect x="512.6666666666667" y="717.3" width="454.6666666666667" height="150" rx="4" fill="#fff0bb" stroke="#203b3314" />
<path d="M949.3333333333335 717.3h18v18z" fill="#203b3315"/>
<text x="528.6666666666667" y="742.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">INTERPRETACIÓN</text>
<text x="528.6666666666667" y="770.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">Lectura de MODA</text>
<text x="528.6666666666667" y="800.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Cada categoría evaluada pesa igual. Si</text>
<text x="528.6666666666667" y="823.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">cambia la cobertura, revisa también las</text>
<text x="528.6666666666667" y="846.2" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">preguntas comunes.</text>
<rect x="987.3333333333334" y="721.3" width="454.6666666666667" height="150" rx="6" fill="#273f3112" stroke="none" />
<rect x="985.3333333333334" y="717.3" width="454.6666666666667" height="150" rx="4" fill="#dcebdc" stroke="#203b3314" />
<path d="M1422.0 717.3h18v18z" fill="#203b3315"/>
<text x="1001.3333333333334" y="742.3" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">MEDICIÓN</text>
<text x="1001.3333333333334" y="770.3" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">Resultado del negocio</text>
<text x="1001.3333333333334" y="800.3" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Las pruebas comprueban comportamiento. El</text>
<text x="1001.3333333333334" y="823.25" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">efecto sobre tiempo, errores y costo se</text>
<text x="1001.3333333333334" y="846.2" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">mide con usuarios.</text>
<path d="M40 897.3L1440 897.3" fill="none" stroke="#cbd1c7" stroke-width="2" />
<text x="40" y="927.3" font-size="14" font-weight="400" fill="#53645b" text-anchor="start">Fuentes: guía del workshop y rúbricas de AWS Samples enlazadas en RECURSOS.md</text>
<text x="1440" y="927.3" font-size="13" font-weight="700" fill="#53645b" text-anchor="end">BOOKING MIT · MATERIAL ABIERTO</text></g>
</svg>
