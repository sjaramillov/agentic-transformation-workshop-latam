<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de análisis, remediación y nueva medición</title>
  <desc id="desc">Siete etapas conectan el diseño del agente, los análisis ARA y MODA, la priorización, una remediación local, la revisión humana, la integración y una nueva medición comparable.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d8d3c8" /></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#344354" flood-opacity=".16" /></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536575" /></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17283b}.white{fill:#fffdfa!important}.muted{fill:#536575}.kicker{font-size:14px;font-weight:800;letter-spacing:2px}.title{font-size:34px;font-weight:800}.subtitle{font-size:17px}.step{font-size:13px;font-weight:900;letter-spacing:1px}.note-title{font-size:18px;font-weight:850}.body{font-size:15px}.tiny{font-size:12px;font-weight:700}.panel-title{font-size:20px;font-weight:850}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f4f1e9" /><rect width="1600" height="980" fill="url(#grid)" opacity=".55" />
  <path d="M0 0H1600V140H0Z" fill="#17283b" />
  <text x="42" y="38" class="kicker" style="fill:#a8d9e6">CONTINUOUS MODERNIZATION · D–I</text>
  <text x="42" y="83" class="title white" style="fill:#fffdfa">Medir, cambiar y comprobar</text>
  <text x="42" y="115" class="subtitle" style="fill:#d8e3eb">La remediación solo es una hipótesis hasta que una nueva medición confirma el resultado.</text>
  <text x="1554" y="48" text-anchor="end" class="tiny" style="fill:#c6d5df">ARA Y MODA SON LECTURAS DISTINTAS</text>


  <g fill="none" stroke="#687887" stroke-width="2.5">
    <path d="M247 327H269" /><path d="M465 327H487" /><path d="M683 327H705" /><path d="M901 327H923" /><path d="M1119 327H1141" /><path d="M1337 327H1359" />
  </g>
  <g filter="url(#shadow)">
    <g><rect x="45" y="208" width="202" height="238" rx="15" fill="#e7ddf4" /><rect x="45" y="208" width="202" height="11" rx="6" fill="#8974ad" /><text x="64" y="250" class="step" style="fill:#69578e">01 · A–C</text><text x="64" y="286" class="note-title">Diseñar</text><text x="64" y="322" class="body">Mapear el proceso,</text><text x="64" y="344" class="body">decidir la oportunidad</text><text x="64" y="366" class="body">y fijar autonomía.</text><rect x="63" y="395" width="166" height="30" rx="15" fill="#fff9e8" /><text x="146" y="415" text-anchor="middle" class="tiny">contexto A–C</text></g>
    <g><rect x="263" y="208" width="202" height="238" rx="15" fill="#ffd9d3" /><rect x="263" y="208" width="202" height="11" rx="6" fill="#cb7468" /><text x="282" y="250" class="step" style="fill:#9e4f45">02 · D</text><text x="282" y="286" class="note-title">ARA</text><text x="282" y="322" class="body">¿Puede el agente</text><text x="282" y="344" class="body">llamar al servicio</text><text x="282" y="366" class="body">con seguridad?</text><rect x="281" y="395" width="166" height="30" rx="15" fill="#fff9e8" /><text x="364" y="415" text-anchor="middle" class="tiny">clasifica hallazgos</text></g>
    <g><rect x="481" y="208" width="202" height="238" rx="15" fill="#d3e9ef" /><rect x="481" y="208" width="202" height="11" rx="6" fill="#5791a2" /><text x="500" y="250" class="step" style="fill:#366d7d">03 · E / F OPC.</text><text x="500" y="286" class="note-title">MODA</text><text x="500" y="322" class="body">¿Qué rutas de</text><text x="500" y="344" class="body">modernización ayudan?</text><text x="500" y="366" class="body">F amplía al estate.</text><rect x="499" y="395" width="166" height="30" rx="15" fill="#fff9e8" /><text x="582" y="415" text-anchor="middle" class="tiny">expone pathways</text></g>
    <g><rect x="699" y="208" width="202" height="238" rx="15" fill="#ffe9a9" /><rect x="699" y="208" width="202" height="11" rx="6" fill="#c79a38" /><text x="718" y="250" class="step" style="fill:#926a20">04 · G</text><text x="718" y="286" class="note-title">Priorizar</text><text x="718" y="322" class="body">Relacionar blockers,</text><text x="718" y="344" class="body">pathways y agente</text><text x="718" y="366" class="body">con dueños reales.</text><rect x="717" y="395" width="166" height="30" rx="15" fill="#fff9e8" /><text x="800" y="415" text-anchor="middle" class="tiny">hoja de ruta</text></g>
    <g><rect x="917" y="208" width="202" height="238" rx="15" fill="#d9ecdc" /><rect x="917" y="208" width="202" height="11" rx="6" fill="#5f9870" /><text x="936" y="250" class="step" style="fill:#3d7450">05 · H</text><text x="936" y="286" class="note-title">Remediar</text><text x="936" y="322" class="body">Ejecutar la TD</text><text x="936" y="344" class="body">en una rama local;</text><text x="936" y="366" class="body">capturar el diff.</text><rect x="935" y="395" width="166" height="30" rx="15" fill="#fff9e8" /><text x="1018" y="415" text-anchor="middle" class="tiny">--local no despliega</text></g>
    <g><rect x="1135" y="208" width="202" height="238" rx="15" fill="#f8e4c8" /><rect x="1135" y="208" width="202" height="11" rx="6" fill="#bd8550" /><text x="1154" y="250" class="step" style="fill:#8c5b30">06 · GATE HUMANO</text><text x="1154" y="286" class="note-title">Revisar</text><text x="1154" y="322" class="body">Inspeccionar cambio,</text><text x="1154" y="344" class="body">pruebas y política;</text><text x="1154" y="366" class="body">integrar con dueño.</text><rect x="1153" y="395" width="166" height="30" rx="15" fill="#fff9e8" /><text x="1236" y="415" text-anchor="middle" class="tiny">no merge ciego</text></g>
    <g><rect x="1353" y="208" width="202" height="238" rx="15" fill="#dce6f2" /><rect x="1353" y="208" width="202" height="11" rx="6" fill="#6282aa" /><text x="1372" y="250" class="step" style="fill:#45658d">07 · I</text><text x="1372" y="286" class="note-title">Medir otra vez</text><text x="1372" y="322" class="body">Analizar main con</text><text x="1372" y="344" class="body">el mismo alcance;</text><text x="1372" y="366" class="body">comparar evidencias.</text><rect x="1371" y="395" width="166" height="30" rx="15" fill="#fff9e8" /><text x="1454" y="415" text-anchor="middle" class="tiny">findings + rutas</text></g>
  </g>


  <g filter="url(#shadow)">
    <rect x="70" y="500" width="680" height="142" rx="16" fill="#fffdfa" stroke="#dfb0a8" stroke-width="2" />
    <rect x="70" y="500" width="14" height="142" rx="7" fill="#cb7468" />
    <text x="104" y="536" class="step" style="fill:#9e4f45">ARA · READINESS PARA AGENTES</text>
    <text x="104" y="574" class="panel-title">¿Qué impide operar con seguridad?</text>
    <text x="104" y="608" class="body">Lee tier y categorías de clasificación; el informe explica evidencia y recomendaciones.</text>
    <rect x="790" y="500" width="740" height="142" rx="16" fill="#fffdfa" stroke="#a9ccd4" stroke-width="2" />
    <rect x="790" y="500" width="14" height="142" rx="7" fill="#5791a2" />
    <text x="824" y="536" class="step" style="fill:#366d7d">MODA · READINESS DE MODERNIZACIÓN</text>
    <text x="824" y="574" class="panel-title">¿Qué ruta habilita la plataforma?</text>
    <text x="824" y="608" class="body">Lee dimensiones y pathways; no la mezcles con la clasificación ARA.</text>
  </g>


  <path d="M1555 327H1582V712H28V470H800V448" fill="none" stroke="#536575" stroke-width="2.5" stroke-dasharray="8 8" />
  <rect x="582" y="692" width="500" height="38" rx="19" fill="#f4f1e9" stroke="#c9c5bb" />
  <text x="832" y="717" text-anchor="middle" class="tiny">VOLVER A PRIORIZAR · MISMO REPO · MISMO ALCANCE</text>


  <rect x="48" y="748" width="1504" height="174" rx="18" fill="#17283b" />
  <text x="77" y="786" class="step" style="fill:#a8d9e6">TRES GUARDAS PARA QUE LA COMPARACIÓN SIRVA</text>
  <g>
    <circle cx="105" cy="837" r="18" fill="#ffe49b" /><text x="105" y="843" text-anchor="middle" class="tiny">1</text><text x="136" y="833" class="body white" style="fill:#fffdfa">Mismo alcance y rama</text><text x="136" y="856" class="tiny" style="fill:#d3dee7">La herramienta analiza la rama por defecto.</text>
    <circle cx="604" cy="837" r="18" fill="#cfe8f0" /><text x="604" y="843" text-anchor="middle" class="tiny">2</text><text x="635" y="833" class="body white" style="fill:#fffdfa">Comparar hallazgos concretos</text><text x="635" y="856" class="tiny" style="fill:#d3dee7">Tiers y pathways antes que totales agregados.</text>
    <circle cx="1100" cy="837" r="18" fill="#d9ecdc" /><text x="1100" y="843" text-anchor="middle" class="tiny">3</text><text x="1131" y="833" class="body white" style="fill:#fffdfa">Verificar el informe nuevo</text><text x="1131" y="856" class="tiny" style="fill:#d3dee7">Markdown/JSON si el HTML parece desactualizado.</text>
  </g>
  <text x="50" y="960" class="tiny muted">Fuente conceptual: módulos D–I. ARA y MODA no comparten el mismo tipo de hallazgo ni el mismo criterio de éxito.</text>
