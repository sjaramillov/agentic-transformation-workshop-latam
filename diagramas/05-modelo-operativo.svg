<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Modelo operativo para transformar con agentes</title>
  <desc id="desc">Cinco puertas desde confirmar la plataforma destino hasta operar el servicio, más tarjetas con responsabilidades de AWS Transform, plataforma, aplicaciones, seguridad e identidad y SRE.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d8d3c8"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#344354" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536575"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17283b}.white{fill:#fffdfa!important}.muted{fill:#536575}.kicker{font-size:14px;font-weight:800;letter-spacing:2px}.title{font-size:34px;font-weight:800}.subtitle{font-size:17px}.step{font-size:12px;font-weight:900;letter-spacing:1px}.owner{font-size:11px;font-weight:900;letter-spacing:.8px}.note-title{font-size:19px;font-weight:850}.body{font-size:15px}.tiny{font-size:12px;font-weight:700}.panel{font-size:17px;font-weight:850}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f4f1e9"/><rect width="1600" height="980" fill="url(#grid)" opacity=".55"/>
  <path d="M0 0H1600V140H0Z" fill="#17283b"/>
  <text x="42" y="38" class="kicker" fill="#a8d9e6">OPERATING MODEL · J</text>
  <text x="42" y="83" class="title white" style="fill:#fffdfa">La plataforma abre la ruta; los equipos la sostienen</text>
  <text x="42" y="115" class="subtitle" fill="#d8e3eb">Una Transformation Definition (TD) tiene que encajar con un destino real, un servicio dueño y un modelo de operación.</text>
  <text x="1554" y="48" text-anchor="end" class="tiny" fill="#c6d5df">CICLO CONTROLADO · NO FAN-OUT AUTOMÁTICO</text>

  <!-- Control gates -->
  <g fill="none" stroke="#687887" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M330 351H358"/><path d="M635 351H663"/><path d="M940 351H968"/><path d="M1245 351H1273"/>
  </g>
  <g filter="url(#shadow)">
    <g><rect x="42" y="192" width="288" height="305" rx="16" fill="#dcefe2"/><rect x="42" y="192" width="288" height="12" rx="7" fill="#619775"/><text x="65" y="238" class="step" fill="#3f7652">GATE 01 · ANTES DE ELEGIR TD</text><text x="65" y="276" class="note-title">¿Existe el destino?</text><rect x="65" y="296" width="242" height="32" rx="16" fill="#fffdfa"/><text x="186" y="317" text-anchor="middle" class="owner">DUEÑO · PLATAFORMA</text><text x="65" y="365" class="body">Confirma que existen y se</text><text x="65" y="389" class="body">operan el clúster, el pipeline,</text><text x="65" y="413" class="body">los módulos IaC y la identidad</text><text x="65" y="437" class="body">que el cambio necesita.</text><text x="65" y="473" class="tiny muted">Sin plataforma destino, no hay</text><text x="65" y="490" class="tiny muted">golden path que desplegar.</text></g>
    <g><rect x="347" y="192" width="288" height="305" rx="16" fill="#e5dcf3"/><rect x="347" y="192" width="288" height="12" rx="7" fill="#8974ad"/><text x="370" y="238" class="step" fill="#69578e">GATE 02 · DISEÑAR</text><text x="370" y="276" class="note-title">Definir la TD</text><rect x="370" y="296" width="242" height="32" rx="16" fill="#fffdfa"/><text x="491" y="317" text-anchor="middle" class="owner">DUEÑOS · PLATAFORMA + APP</text><text x="370" y="365" class="body">Declarar alcance, supuestos,</text><text x="370" y="389" class="body">runtime, conflictos y reglas de</text><text x="370" y="413" class="body">reentrada. Versionar el prompt</text><text x="370" y="437" class="body">y el modelo que la ejecutan.</text><text x="370" y="473" class="tiny muted">Si IaC está separado del código,</text><text x="370" y="490" class="tiny muted">planear la secuencia entre repos.</text></g>
    <g><rect x="652" y="192" width="288" height="305" rx="16" fill="#ffe9a9"/><rect x="652" y="192" width="288" height="12" rx="7" fill="#c79a38"/><text x="675" y="238" class="step" fill="#926a20">GATE 03 · REVISAR JUNTOS</text><text x="675" y="276" class="note-title">Leer el diff</text><rect x="675" y="296" width="242" height="32" rx="16" fill="#fffdfa"/><text x="796" y="317" text-anchor="middle" class="owner">DUEÑOS · APP + SEGURIDAD</text><text x="675" y="365" class="body">Comprueba evidencia, límites</text><text x="675" y="389" class="body">de datos, autenticación y que</text><text x="675" y="413" class="body">el cambio siga la política del</text><text x="675" y="437" class="body">servicio y su agente objetivo.</text><text x="675" y="473" class="tiny muted">La salida de una TD no es</text><text x="675" y="490" class="tiny muted">determinista como Terraform.</text></g>
    <g><rect x="957" y="192" width="288" height="305" rx="16" fill="#cfe8f0"/><rect x="957" y="192" width="288" height="12" rx="7" fill="#5791a2"/><text x="980" y="238" class="step" fill="#366d7d">GATE 04 · PROBAR</text><text x="980" y="276" class="note-title">Integrar en etapas</text><rect x="980" y="296" width="242" height="32" rx="16" fill="#fffdfa"/><text x="1101" y="317" text-anchor="middle" class="owner">DUEÑOS · CI + EQUIPO APP</text><text x="980" y="365" class="body">Ejecuta tests del servicio y</text><text x="980" y="389" class="body">prueba la TD con repos reales</text><text x="980" y="413" class="body">representativos. Empieza con un</text><text x="980" y="437" class="body">canario; no abras fan-out aún.</text><text x="980" y="473" class="tiny muted">Asegura revisión, rollback y</text><text x="980" y="490" class="tiny muted">capacidad para atender PRs.</text></g>
    <g><rect x="1262" y="192" width="288" height="305" rx="16" fill="#f8ddd6"/><rect x="1262" y="192" width="288" height="12" rx="7" fill="#cb7468"/><text x="1285" y="238" class="step" fill="#9e4f45">GATE 05 · OPERAR</text><text x="1285" y="276" class="note-title">Cuidar el servicio</text><rect x="1285" y="296" width="242" height="32" rx="16" fill="#fffdfa"/><text x="1406" y="317" text-anchor="middle" class="owner">DUEÑOS · SRE + IDENTIDAD</text><text x="1285" y="365" class="body">Define trazas, alarmas,</text><text x="1285" y="389" class="body">runbook, tokens de máquina,</text><text x="1285" y="413" class="body">rollback y responsable on-call</text><text x="1285" y="437" class="body">antes de llegar a producción.</text><text x="1285" y="473" class="tiny muted">Vuelve a medir después de</text><text x="1285" y="490" class="tiny muted">integrar y desplegar.</text></g>
  </g>

  <text x="50" y="552" class="step" fill="#315a77">QUIÉN APORTA QUÉ</text>
  <g filter="url(#shadow)">
    <g><rect x="42" y="573" width="286" height="142" rx="14" fill="#fffdfa" stroke="#d7d2c8"/><circle cx="78" cy="609" r="18" fill="#d3e9ef"/><text x="78" y="615" text-anchor="middle" class="tiny">AWS</text><text x="109" y="615" class="panel">Transform</text><text x="64" y="652" class="body">Motor de análisis y</text><text x="64" y="675" class="body">ejecución de remediaciones.</text><text x="64" y="700" class="tiny muted">No opera la plataforma destino.</text></g>
    <g><rect x="347" y="573" width="286" height="142" rx="14" fill="#fffdfa" stroke="#d7d2c8"/><circle cx="383" cy="609" r="18" fill="#dcefe2"/><text x="383" y="615" text-anchor="middle" class="tiny">PL</text><text x="414" y="615" class="panel">Plataforma</text><text x="369" y="652" class="body">Mantiene golden paths,</text><text x="369" y="675" class="body">catálogo de TD e IaC destino.</text><text x="369" y="700" class="tiny muted">Revisa adopción y dependencias.</text></g>
    <g><rect x="652" y="573" width="288" height="142" rx="14" fill="#fffdfa" stroke="#d7d2c8"/><circle cx="688" cy="609" r="18" fill="#ffe9a9"/><text x="688" y="615" text-anchor="middle" class="tiny">APP</text><text x="719" y="615" class="panel">Equipo de servicio</text><text x="674" y="652" class="body">Aporta contexto, revisa el diff,</text><text x="674" y="675" class="body">prueba y mantiene el servicio.</text><text x="674" y="700" class="tiny muted">Acepta o devuelve la propuesta.</text></g>
    <g><rect x="957" y="573" width="288" height="142" rx="14" fill="#fffdfa" stroke="#d7d2c8"/><circle cx="993" cy="609" r="18" fill="#e5dcf3"/><text x="993" y="615" text-anchor="middle" class="tiny">SEC</text><text x="1024" y="615" class="panel">Seguridad + identidad</text><text x="979" y="652" class="body">Fijan políticas, autorizaciones,</text><text x="979" y="675" class="body">auditoría y proveedor de tokens.</text><text x="979" y="700" class="tiny muted">Revisan el acceso de máquina.</text></g>
    <g><rect x="1262" y="573" width="288" height="142" rx="14" fill="#fffdfa" stroke="#d7d2c8"/><circle cx="1298" cy="609" r="18" fill="#f8ddd6"/><text x="1298" y="615" text-anchor="middle" class="tiny">SRE</text><text x="1329" y="615" class="panel">Operación</text><text x="1284" y="652" class="body">Define observabilidad, respuesta</text><text x="1284" y="675" class="body">a incidentes y rollback.</text><text x="1284" y="700" class="tiny muted">Debe poder sostener el canario.</text></g>
  </g>

  <rect x="42" y="760" width="1508" height="162" rx="18" fill="#17283b"/>
  <text x="72" y="799" class="step" fill="#a8d9e6">ANTES DE AMPLIAR A MÁS REPOSITORIOS</text>
  <text x="72" y="839" class="body white" style="fill:#fffdfa">Versiona TD, prompt y modelo  ·  prueba repositorios representativos  ·  declara reentrada y conflictos  ·  define rollback y on-call.</text>
  <text x="72" y="876" class="body white" style="fill:#fffdfa">La capacidad para revisar PRs y operar el destino limita el ritmo seguro de adopción.</text>
  <text x="42" y="962" class="tiny muted">Síntesis del módulo J. Las responsabilidades exactas se acuerdan dentro de cada organización.</text>
</svg>
