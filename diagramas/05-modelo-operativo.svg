<text x="1190" y="418" font-size="20" font-weight="650" fill="#203b33" text-anchor="start">Cambio revisado y</text>
<text x="1190" y="445.0" font-size="20" font-weight="650" fill="#203b33" text-anchor="start">probado</text>
<rect x="30" y="542" width="1420" height="150" rx="6" fill="#fffdf5" stroke="#d0d7cb" />
