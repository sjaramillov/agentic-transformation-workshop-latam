<rect x="225" y="882" width="265" height="126" rx="4" fill="#f9d8d0" stroke="#203b3314" />
<path d="M472 882h18v18z" fill="#203b3315"/>
<text x="241" y="907" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">ACUERDO</text>
<text x="241" y="935" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">Servicio sostenible</text>
<text x="241" y="965.0" font-size="17" font-weight="400" fill="#203b33" text-anchor="start"></text>
<text x="525" y="910" font-size="21" font-weight="400" fill="#203b33" text-anchor="start">Preparar alertas, restauración, runbook y</text>
<text x="525" y="938.35" font-size="21" font-weight="400" fill="#203b33" text-anchor="start">responsable de incidentes. Medir el resultado del</text>
<text x="525" y="966.7" font-size="21" font-weight="400" fill="#203b33" text-anchor="start">piloto.</text>
<text x="1190" y="910" font-size="20" font-weight="650" fill="#203b33" text-anchor="start">Señales y respuesta</text>
<text x="40" y="1054" font-size="15" font-weight="800" fill="#276459" text-anchor="start">CUANDO SE REUTILICE UNA TRANSFORMATION DEFINITION (TD)</text>
<text x="40" y="1083" font-size="18" font-weight="400" fill="#203b33" text-anchor="start">Versiona su alcance y reglas; pruébala en repositorios representativos; revisa sus cambios y prepara reversión antes de ampliar su uso.</text>
