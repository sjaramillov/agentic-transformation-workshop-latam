<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1016.5999999999999" role="img" aria-labelledby="title desc">
<title id="title">Del dolor a una mejora con valor</title><desc id="desc">Preguntas y entregables para conectar discovery, ARA/MODA y AI-DLC.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#c4cbbd"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#276459"/></marker></defs>
<rect width="100%" height="100%" fill="#f6f4ed"/><rect width="100%" height="100%" fill="url(#dots)" opacity=".55"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="40" y="42" font-size="15" font-weight="750" fill="#276459" text-anchor="start">RECORRIDO COMPLETO · BOOKING MIT</text>
<text x="40" y="94" font-size="38" font-weight="760" fill="#203b33" text-anchor="start">Del dolor a una mejora con valor</text>
<text x="40" y="129" font-size="19" font-weight="400" fill="#53645b" text-anchor="start">Preguntas y entregables para conectar discovery, ARA/MODA y AI-DLC.</text>
<path d="M40 155L1160 155" fill="none" stroke="#cbd1c7" stroke-width="2" />
<text x="40" y="200" font-size="16" font-weight="800" fill="#276459" text-anchor="start">INCEPTION · ENTENDER Y DECIDIR</text>
<rect x="42.0" y="232" width="551.0" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="40.0" y="228" width="551.0" height="127" rx="4" fill="#f9d8d0" stroke="#203b3314" />
<path d="M573.0 228h18v18z" fill="#203b3315"/>
<text x="56.0" y="253" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">PROBLEMA</text>
<text x="56.0" y="281" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">1 · ¿Dónde se atasca?</text>
<text x="56.0" y="311.0" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Cliente y coach: proceso, excepción y trabajo manual.</text>
<text x="56.0" y="333.95" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Tablero A.</text>
<rect x="611.0" y="232" width="551.0" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="609.0" y="228" width="551.0" height="127" rx="4" fill="#dcebdc" stroke="#203b3314" />
<path d="M1142.0 228h18v18z" fill="#203b3315"/>
<text x="625.0" y="253" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">HIPÓTESIS</text>
<text x="625.0" y="281" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">2 · ¿Qué cambiaría?</text>
<text x="625.0" y="311.0" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Línea base, resultado esperado, costo y alternativa.</text>
<text x="625.0" y="333.95" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Tablero B y ficha de valor.</text>
<path d="M600 370L600 397" fill="none" stroke="#276459" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="420" font-size="16" font-weight="800" fill="#276459" text-anchor="start">INCEPTION · DELIMITAR Y EVALUAR</text>
<rect x="42.0" y="452" width="551.0" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="40.0" y="448" width="551.0" height="127" rx="4" fill="#fff0bb" stroke="#203b3314" />
<path d="M573.0 448h18v18z" fill="#203b3315"/>
<text x="56.0" y="473" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">ALCANCE</text>
<text x="56.0" y="501" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">3 · ¿Qué puede hacer?</text>
<text x="56.0" y="531.0" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Tarea, lecturas, escrituras y aprobación por acción.</text>
<text x="56.0" y="553.95" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Tablero C.</text>
<rect x="611.0" y="452" width="551.0" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="609.0" y="448" width="551.0" height="127" rx="4" fill="#d7eaf2" stroke="#203b3314" />
<path d="M1142.0 448h18v18z" fill="#203b3315"/>
<text x="625.0" y="473" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">EVALUACIÓN</text>
<text x="625.0" y="501" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">4 · ¿Qué falta?</text>
<text x="625.0" y="531.0" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">ARA: controles de interacción. MODA: brechas y</text>
<text x="625.0" y="553.95" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">alternativas de modernización.</text>
<path d="M600 590L600 617" fill="none" stroke="#276459" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="640" font-size="16" font-weight="800" fill="#276459" text-anchor="start">CONSTRUCTION → OPERATIONS</text>
<rect x="42.0" y="672" width="551.0" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="40.0" y="668" width="551.0" height="127" rx="4" fill="#e5dcf1" stroke="#203b3314" />
<path d="M573.0 668h18v18z" fill="#203b3315"/>
<text x="56.0" y="693" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">CONSTRUCTION</text>
<text x="56.0" y="721" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">5 · ¿Qué probamos?</text>
<text x="56.0" y="751.0" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Una unidad: agente, API y PostgreSQL. Pruebas de</text>
<text x="56.0" y="773.95" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">fallos, recuperación y reevaluación.</text>
<rect x="611.0" y="672" width="551.0" height="127" rx="6" fill="#273f3112" stroke="none" />
<rect x="609.0" y="668" width="551.0" height="127" rx="4" fill="#dcebdc" stroke="#203b3314" />
<path d="M1142.0 668h18v18z" fill="#203b3315"/>
<text x="625.0" y="693" font-size="12" font-weight="800" fill="#203b33" text-anchor="start">OPERATIONS</text>
<text x="625.0" y="721" font-size="20" font-weight="750" fill="#203b33" text-anchor="start">6 · ¿Qué resultado tuvo?</text>
<text x="625.0" y="751.0" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">Medir tiempo humano, errores y costo. Continuar,</text>
<text x="625.0" y="773.95" font-size="17" font-weight="400" fill="#203b33" text-anchor="start">ajustar o detener con el dueño.</text>
<path d="M600 810L600 837" fill="none" stroke="#276459" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="860" font-size="15" font-weight="800" fill="#276459" text-anchor="start">EL CICLO CONTINÚA</text>
<text x="40" y="889" font-size="18" font-weight="400" fill="#203b33" text-anchor="start">La evaluación informa las decisiones iniciales y se repite después del cambio. El resultado medido alimenta</text>
<text x="40" y="913.3" font-size="18" font-weight="400" fill="#203b33" text-anchor="start">el siguiente ciclo de AI-DLC.</text>
<path d="M40 961.5999999999999L1160 961.5999999999999" fill="none" stroke="#cbd1c7" stroke-width="2" />
<text x="40" y="991.5999999999999" font-size="14" font-weight="400" fill="#53645b" text-anchor="start">Caso práctico: FICHA_VALOR.md · AI_DLC.md · GUIA_REPLICACION.md</text>
<text x="1160" y="991.5999999999999" font-size="13" font-weight="700" fill="#53645b" text-anchor="end">BOOKING MIT · MATERIAL ABIERTO</text></g>
